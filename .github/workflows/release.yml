name: Release Desktop Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64 --publish always
          - os: macos-latest
            args: --mac --universal --publish always
          - os: ubuntu-latest
            args: --linux --x64 --publish always
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated unit & 50k-word latency benchmark tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Build & Publish Desktop Installer + Auto-Updater Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.args }}
